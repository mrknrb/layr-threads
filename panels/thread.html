<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thread</title>
  <link rel="stylesheet" href="/_layr/layr.css">
  <link rel="stylesheet" href="claude.css">
  <link rel="stylesheet" href="thread.css">
  <script src="/_layr/layr.js"></script>
</head>
<body>
  <div id="app">
    <header id="head">
      <div class="head-main">
        <button class="btn ghost small icon-only" id="switch" title="Other threads (switch this panel to one)"></button>
        <span id="status-dot" class="dot"></span>
        <h1 id="title" title="Click to rename">Loading…</h1>
        <span id="status-label" class="muted"></span>
      </div>
      <div class="head-meta">
        <button id="changes-chip" class="chip-btn" hidden title="What this thread changed against its base branch"></button>
        <span id="workspace" class="badge mono"></span>
        <button id="concepts-chip" class="chip-btn" hidden title="The concept nodes this thread touched"></button>
        <button id="skills-chip" class="chip-btn" hidden title="The layr skills this thread gets"></button>
        <span id="cost" class="muted"></span>
        <span id="context" class="ctx" hidden></span>
        <button class="btn ghost small icon-only" id="more" title="More"></button>
      </div>
    </header>
    <section id="task" hidden></section>
    <section id="plugins" hidden></section>
    <section id="changes" hidden></section>
    <section id="concepts" hidden></section>
    <section id="skills" hidden></section>
    <section id="subbar" hidden></section>
    <main id="scroller">
      <div id="log">
        <div class="empty" id="loading">Loading the conversation…</div>
      </div>
      <div id="subview" hidden></div>
      <div id="working" hidden><span class="spinner"></span><span id="working-text">Working…</span></div>
    </main>
    <section id="dock">
      <div id="subagents" hidden></div>
      <div id="gone" hidden></div>
      <div id="background" hidden></div>
      <div id="todos" hidden></div>
      <div id="queue" hidden></div>
      <div id="composer">
        <div id="slash" hidden></div>
        <div id="prefix" hidden></div>
        <div id="attachments" hidden></div>
        <textarea id="input" rows="1" placeholder="Message Claude…  (Enter to send, Shift+Enter for a new line, / for commands)"></textarea>
        <div id="bar">
          <button class="btn ghost small icon-only" id="attach" title="Attach an image"></button>
          <input type="file" id="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
          <select class="select compact" id="model" title="Model"></select>
          <select class="select compact" id="effort" title="Effort (how hard Claude thinks)"></select>
          <select class="select compact" id="mode" title="Permission mode"></select>
          <span class="grow"></span>
          <span id="hint" class="muted"></span>
          <button class="btn small danger" id="stop" hidden>Stop</button>
          <button class="btn small" id="steer" hidden title="Put this message into the running turn now (Ctrl+Enter)">Steer now</button>
          <button class="btn small" id="away" hidden title="🌙 When away: what you send waits in the pipeline's Ready until you go Away (the thread becomes a pipeline task)">🌙</button>
          <button class="btn small primary" id="send">Send</button>
        </div>
      </div>
    </section>
  </div>
  <div id="lightbox" hidden></div>
  <script type="module" src="thread.js"></script>
</body>
</html>
